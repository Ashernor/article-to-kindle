  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff; --fg: #1a1a1a; --muted: #6b7280; --border: #d0d0d5;
      --card: #ffffff; --accent: #d97706; --row-hover: #f5f5f7;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1c1c1e; --fg: #f2f2f7; --muted: #9ca3af; --border: #3a3a3c; --card: #2c2c2e; --row-hover: #333336; }
    }
    body { font: 15px/1.5 system-ui, -apple-system, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 20px; background: var(--bg); color: var(--fg); }
    .head { text-align: center; margin-bottom: 8px; }
    .head img { width: 72px; height: 72px; }
    h1 { font-size: 22px; margin: 10px 0 2px; }
    .version { color: var(--muted); font-size: 13px; }
    .tagline { text-align: center; color: var(--muted); margin: 8px auto 24px; max-width: 44ch; }
    h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 26px 0 8px; }
    .list { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--card); }
    a.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 16px; color: var(--fg); text-decoration: none; border-bottom: 1px solid var(--border); }
    a.row:last-child { border-bottom: 0; }
    a.row:hover { background: var(--row-hover); }
    a.row .emoji { margin-right: 10px; }
    a.row .chev { color: var(--muted); }
    .accent { color: var(--accent); font-weight: 600; }
    footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 28px; }
    a { color: var(--accent); }
  </style>
</head>
