<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="popup.css" />
  <title>Article → Kindle</title>
</head>
<body>
  <header><h1>Article → Kindle</h1></header>

  <button id="send" class="primary" data-i18n="ctxSend">Send to Kindle</button>
  <p id="status" class="status" role="status"></p>

  <details id="settings">
    <summary data-i18n="settingsSummary">Settings</summary>

    <label data-i18n="modeLabel">Delivery mode</label>
    <div class="radios">
      <label><input type="radio" name="mode" value="download" /> <span data-i18n="modeDownload">Download the EPUB</span></label>
      <label><input type="radio" name="mode" value="relay" /> <span data-i18n="modeEmail">Send by email (relay)</span></label>
    </div>

    <div class="relay-only">
      <label for="kindleEmail" data-i18n="kindleEmailLabel">Kindle address (@kindle.com)</label>
      <input id="kindleEmail" type="email" placeholder="firstname_xxxx@kindle.com" />

      <label for="relayUrl" data-i18n="relayUrlLabel">Relay URL (Netlify)</label>
      <input id="relayUrl" type="url" placeholder="https://my-relay.netlify.app/.netlify/functions/send" />

      <label for="relayToken" data-i18n="relayTokenLabel">Relay token (optional)</label>
      <input id="relayToken" type="text" data-i18n-ph="relayTokenPh" placeholder="if RELAY_TOKEN is set" />

      <p class="hint" data-i18n="relayHint">The sender configured on your relay must be on Amazon's approved list.</p>
    </div>

    <button id="save" class="secondary" data-i18n="saveBtn">Save</button>
  </details>


  <a class="about-link" href="../about/about.html" target="_blank" data-i18n="aboutLink">About</a>

  <script src="popup.js"></script>
</body>
</html>
